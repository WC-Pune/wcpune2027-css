# Copies every push to main on isheeba/wcpune2027-css over to wppune/wcpune2027-css.
# Needs a repo secret WPPUNE_PUSH_TOKEN: a classic PAT with "repo" + "workflow" scopes
# from an account that can push to wppune/wcpune2027-css.
name: Mirror to wppune

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  mirror:
    # This file is mirrored too; don't run it on the wppune copy.
    if: github.repository == 'isheeba/wcpune2027-css'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Push main to wppune
        env:
          TOKEN: ${{ secrets.WPPUNE_PUSH_TOKEN }}
        run: git push "https://x-access-token:${TOKEN}@github.com/wppune/wcpune2027-css.git" HEAD:main
